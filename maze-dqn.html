<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Maze Runner - DQN AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
            color: #fff;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #0f0f1e;
            touch-action: none;
            border: 2px solid #16213e;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            min-width: 200px;
        }

        #ui div {
            margin: 5px 0;
        }

        .player-stat {
            color: #4af;
        }

        .ai-stat {
            color: #0ff;
        }

        .ai-learning {
            color: #f0f;
            font-size: 12px;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .dpad {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .btn {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: rgba(100, 100, 255, 0.3);
            border: 2px solid rgba(100, 100, 255, 0.6);
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        .btn:active {
            background: rgba(100, 100, 255, 0.6);
            transform: scale(0.95);
        }

        .btn-up { top: 0; left: 70px; }
        .btn-down { bottom: 0; left: 70px; }
        .btn-left { top: 70px; left: 0; }
        .btn-right { top: 70px; right: 0; }

        #modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #4af;
            text-align: center;
            display: none;
            z-index: 200;
            max-width: 90%;
        }

        #modal h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        #modal button {
            background: #4444ff;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-family: 'Courier New', monospace;
        }

        #modal button:active {
            background: #6666ff;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 5px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f0f, #0ff);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div style="font-size: 16px; margin-bottom: 10px; color: #ff0;">🏆 MAZE RUNNER</div>
        <div class="player-stat">👤 YOU: <span id="playerScore">0</span> gems</div>
        <div class="ai-stat">🤖 AI: <span id="aiScore">0</span> gems</div>
        <div style="margin-top: 10px;">Level: <span id="level">1</span></div>
        <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #333;">
            <div class="ai-learning">AI Training Progress:</div>
            <div class="progress-bar">
                <div class="progress-fill" id="aiProgress" style="width: 0%"></div>
            </div>
            <div class="ai-learning">Episodes: <span id="episodes">0</span></div>
            <div class="ai-learning">Epsilon: <span id="epsilon">1.00</span></div>
        </div>
    </div>

    <div id="controls">
        <div class="dpad">
            <div class="btn btn-up" id="btnUp">▲</div>
            <div class="btn btn-down" id="btnDown">▼</div>
            <div class="btn btn-left" id="btnLeft">◄</div>
            <div class="btn btn-right" id="btnRight">►</div>
        </div>
    </div>

    <div id="modal">
        <h1 id="modalTitle">Level Complete!</h1>
        <p id="modalMessage"></p>
        <div style="margin: 20px 0;">
            <div>Your Score: <span id="finalPlayerScore">0</span></div>
            <div>AI Score: <span id="finalAiScore">0</span></div>
        </div>
        <button onclick="game.nextLevel()">Next Level</button>
        <button onclick="game.restart()">Restart</button>
    </div>

    <script>
        // Simple DQN Implementation
        class DQNAgent {
            constructor(stateSize, actionSize) {
                this.stateSize = stateSize;
                this.actionSize = actionSize;
                this.memory = [];
                this.maxMemory = 2000;
                this.gamma = 0.95; // Discount factor
                this.epsilon = 1.0; // Exploration rate
                this.epsilonMin = 0.01;
                this.epsilonDecay = 0.995;
                this.learningRate = 0.001;
                this.episodes = 0;

                // Simple Q-table instead of neural network (easier for browser)
                this.qTable = {};
            }

            getStateKey(state) {
                return state.join(',');
            }

            getQValues(state) {
                const key = this.getStateKey(state);
                if (!this.qTable[key]) {
                    this.qTable[key] = new Array(this.actionSize).fill(0);
                }
                return this.qTable[key];
            }

            act(state) {
                // Epsilon-greedy policy
                if (Math.random() < this.epsilon) {
                    return Math.floor(Math.random() * this.actionSize);
                }

                const qValues = this.getQValues(state);
                return qValues.indexOf(Math.max(...qValues));
            }

            remember(state, action, reward, nextState, done) {
                this.memory.push({ state, action, reward, nextState, done });
                if (this.memory.length > this.maxMemory) {
                    this.memory.shift();
                }
            }

            replay(batchSize = 32) {
                if (this.memory.length < batchSize) return;

                const batch = [];
                for (let i = 0; i < batchSize; i++) {
                    const idx = Math.floor(Math.random() * this.memory.length);
                    batch.push(this.memory[idx]);
                }

                for (const { state, action, reward, nextState, done } of batch) {
                    const stateKey = this.getStateKey(state);
                    if (!this.qTable[stateKey]) {
                        this.qTable[stateKey] = new Array(this.actionSize).fill(0);
                    }

                    let target = reward;
                    if (!done) {
                        const nextQValues = this.getQValues(nextState);
                        target += this.gamma * Math.max(...nextQValues);
                    }

                    // Q-learning update
                    this.qTable[stateKey][action] +=
                        this.learningRate * (target - this.qTable[stateKey][action]);
                }

                if (this.epsilon > this.epsilonMin) {
                    this.epsilon *= this.epsilonDecay;
                }
            }

            endEpisode() {
                this.episodes++;
                this.replay(32);
            }
        }

        // Game Configuration
        const config = {
            gridSize: 15,
            cellSize: 30,
            fps: 10
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const size = Math.min(window.innerWidth - 20, window.innerHeight - 300);
            config.cellSize = Math.floor(size / config.gridSize);
            canvas.width = config.gridSize * config.cellSize;
            canvas.height = config.gridSize * config.cellSize;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Maze Generator (Simple)
        class Maze {
            constructor(size) {
                this.size = size;
                this.grid = [];
                this.generate();
            }

            generate() {
                // Create grid
                for (let y = 0; y < this.size; y++) {
                    this.grid[y] = [];
                    for (let x = 0; x < this.size; x++) {
                        // Border walls
                        if (x === 0 || x === this.size - 1 || y === 0 || y === this.size - 1) {
                            this.grid[y][x] = 1; // Wall
                        } else {
                            this.grid[y][x] = 0; // Empty
                        }
                    }
                }

                // Add some random walls and gems
                for (let i = 0; i < this.size * 2; i++) {
                    const x = Math.floor(Math.random() * (this.size - 2)) + 1;
                    const y = Math.floor(Math.random() * (this.size - 2)) + 1;

                    if (Math.random() > 0.5) {
                        this.grid[y][x] = 1; // Wall
                    } else {
                        this.grid[y][x] = 2; // Gem
                    }
                }

                // Clear starting positions
                this.grid[1][1] = 0; // Player start
                this.grid[1][2] = 0;
                this.grid[2][1] = 0;

                // Set goal
                this.grid[this.size - 2][this.size - 2] = 3; // Goal
            }

            isWall(x, y) {
                if (x < 0 || x >= this.size || y < 0 || y >= this.size) return true;
                return this.grid[y][x] === 1;
            }

            isGem(x, y) {
                if (x < 0 || x >= this.size || y < 0 || y >= this.size) return false;
                return this.grid[y][x] === 2;
            }

            isGoal(x, y) {
                if (x < 0 || x >= this.size || y < 0 || y >= this.size) return false;
                return this.grid[y][x] === 3;
            }

            collectGem(x, y) {
                if (this.isGem(x, y)) {
                    this.grid[y][x] = 0;
                    return true;
                }
                return false;
            }

            draw() {
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        const cellType = this.grid[y][x];
                        const px = x * config.cellSize;
                        const py = y * config.cellSize;

                        switch(cellType) {
                            case 1: // Wall
                                ctx.fillStyle = '#2d3561';
                                ctx.fillRect(px, py, config.cellSize, config.cellSize);
                                ctx.strokeStyle = '#1a1f3a';
                                ctx.strokeRect(px, py, config.cellSize, config.cellSize);
                                break;
                            case 2: // Gem
                                ctx.fillStyle = '#0f0f1e';
                                ctx.fillRect(px, py, config.cellSize, config.cellSize);
                                ctx.fillStyle = '#ffd700';
                                ctx.beginPath();
                                ctx.arc(px + config.cellSize/2, py + config.cellSize/2,
                                       config.cellSize/4, 0, Math.PI * 2);
                                ctx.fill();
                                break;
                            case 3: // Goal
                                ctx.fillStyle = '#0f4';
                                ctx.fillRect(px, py, config.cellSize, config.cellSize);
                                ctx.fillStyle = '#fff';
                                ctx.font = `${config.cellSize/2}px Arial`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText('🏁', px + config.cellSize/2, py + config.cellSize/2);
                                break;
                            default: // Empty
                                ctx.fillStyle = '#0f0f1e';
                                ctx.fillRect(px, py, config.cellSize, config.cellSize);
                                break;
                        }
                    }
                }
            }
        }

        // Player/AI Character
        class Character {
            constructor(x, y, color, name) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.name = name;
                this.score = 0;
                this.reachedGoal = false;
            }

            move(dx, dy, maze) {
                const newX = this.x + dx;
                const newY = this.y + dy;

                if (!maze.isWall(newX, newY)) {
                    this.x = newX;
                    this.y = newY;

                    if (maze.collectGem(newX, newY)) {
                        this.score += 10;
                        return 10; // Reward
                    }

                    if (maze.isGoal(newX, newY)) {
                        this.reachedGoal = true;
                        return 100; // Big reward
                    }

                    return -1; // Small penalty for moving
                }
                return -10; // Penalty for hitting wall
            }

            getState(maze) {
                // Simple state: nearby walls and goal direction
                const state = [
                    this.x, this.y,
                    maze.isWall(this.x, this.y - 1) ? 1 : 0, // Up
                    maze.isWall(this.x, this.y + 1) ? 1 : 0, // Down
                    maze.isWall(this.x - 1, this.y) ? 1 : 0, // Left
                    maze.isWall(this.x + 1, this.y) ? 1 : 0, // Right
                    maze.isGem(this.x, this.y - 1) ? 1 : 0,
                    maze.isGem(this.x, this.y + 1) ? 1 : 0,
                    maze.isGem(this.x - 1, this.y) ? 1 : 0,
                    maze.isGem(this.x + 1, this.y) ? 1 : 0
                ];
                return state;
            }

            draw() {
                const px = this.x * config.cellSize;
                const py = this.y * config.cellSize;

                if (this.reachedGoal) {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = 0.5;
                } else {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = 1;
                }

                ctx.fillRect(px + 2, py + 2, config.cellSize - 4, config.cellSize - 4);
                ctx.globalAlpha = 1;

                // Draw name
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, px + config.cellSize/2, py - 5);
            }
        }

        // Main Game
        class Game {
            constructor() {
                this.maze = null;
                this.player = null;
                this.ai = null;
                this.agent = new DQNAgent(10, 4); // 10 state features, 4 actions
                this.level = 1;
                this.gameOver = false;
                this.keys = {};
                this.lastMoveTime = 0;
                this.aiMoveInterval = 200; // AI moves every 200ms

                this.init();
                this.setupControls();
                this.gameLoop();
            }

            init() {
                this.maze = new Maze(config.gridSize);
                this.player = new Character(1, 1, '#4af', 'YOU');
                this.ai = new Character(1, 2, '#0ff', 'AI');
                this.gameOver = false;

                document.getElementById('playerScore').textContent = this.player.score;
                document.getElementById('aiScore').textContent = this.ai.score;
                document.getElementById('level').textContent = this.level;
            }

            setupControls() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                    this.handlePlayerMove();
                });

                ['btnUp', 'btnDown', 'btnLeft', 'btnRight'].forEach(id => {
                    const btn = document.getElementById(id);
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const action = {
                            'btnUp': 'ArrowUp',
                            'btnDown': 'ArrowDown',
                            'btnLeft': 'ArrowLeft',
                            'btnRight': 'ArrowRight'
                        }[id];
                        this.keys[action] = true;
                        this.handlePlayerMove();
                    });
                });
            }

            handlePlayerMove() {
                if (this.player.reachedGoal) return;

                let dx = 0, dy = 0;
                if (this.keys['ArrowUp']) dy = -1;
                else if (this.keys['ArrowDown']) dy = 1;
                else if (this.keys['ArrowLeft']) dx = -1;
                else if (this.keys['ArrowRight']) dx = 1;

                if (dx !== 0 || dy !== 0) {
                    this.player.move(dx, dy, this.maze);
                    document.getElementById('playerScore').textContent = this.player.score;
                    this.keys = {}; // Clear keys after move
                    this.checkGameOver();
                }
            }

            updateAI() {
                if (this.ai.reachedGoal) return;

                const state = this.ai.getState(this.maze);
                const action = this.agent.act(state);

                const moves = [[0, -1], [0, 1], [-1, 0], [1, 0]]; // Up, Down, Left, Right
                const [dx, dy] = moves[action];

                const reward = this.ai.move(dx, dy, this.maze);
                const nextState = this.ai.getState(this.maze);
                const done = this.ai.reachedGoal;

                this.agent.remember(state, action, reward, nextState, done);

                if (done) {
                    this.agent.endEpisode();
                }

                document.getElementById('aiScore').textContent = this.ai.score;
                document.getElementById('episodes').textContent = this.agent.episodes;
                document.getElementById('epsilon').textContent = this.agent.epsilon.toFixed(2);

                const progress = Math.min(100, (this.agent.episodes / 50) * 100);
                document.getElementById('aiProgress').style.width = progress + '%';

                this.checkGameOver();
            }

            checkGameOver() {
                if (this.player.reachedGoal && this.ai.reachedGoal) {
                    this.endGame();
                }
            }

            update() {
                if (this.gameOver) return;

                const now = Date.now();
                if (now - this.lastMoveTime > this.aiMoveInterval) {
                    this.updateAI();
                    this.lastMoveTime = now;
                }
            }

            draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                this.maze.draw();
                this.player.draw();
                this.ai.draw();
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }

            endGame() {
                this.gameOver = true;
                const modal = document.getElementById('modal');
                const title = document.getElementById('modalTitle');
                const message = document.getElementById('modalMessage');

                document.getElementById('finalPlayerScore').textContent = this.player.score;
                document.getElementById('finalAiScore').textContent = this.ai.score;

                if (this.player.score > this.ai.score) {
                    title.textContent = '🎉 YOU WIN!';
                    title.style.color = '#4af';
                    message.textContent = 'You collected more gems than the AI!';
                } else if (this.ai.score > this.player.score) {
                    title.textContent = '🤖 AI WINS!';
                    title.style.color = '#0ff';
                    message.textContent = 'The AI outperformed you!';
                } else {
                    title.textContent = '🤝 TIE!';
                    title.style.color = '#ff0';
                    message.textContent = 'Equal performance!';
                }

                modal.style.display = 'block';
            }

            nextLevel() {
                this.level++;
                document.getElementById('modal').style.display = 'none';
                this.init();
            }

            restart() {
                this.level = 1;
                this.agent = new DQNAgent(10, 4); // Reset AI
                document.getElementById('modal').style.display = 'none';
                this.init();
            }
        }

        // Start game
        const game = new Game();
    </script>
</body>
</html>
